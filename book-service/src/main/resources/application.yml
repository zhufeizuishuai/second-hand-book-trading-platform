server:
  port: 8082
  tomcat:
    threads:
      max: 25
    accept-count: 25
    max-connections: 100

spring:
  application:
    name: book-service
  main:
    allow-circular-references: true
  rabbitmq:
    host: 192.168.100.128
    port: 5672
    virtual-host: /second-hand-book-trading-platform
    username: second-hand-book-trading-platform
    password: your-rabbitmq-password
  # 只保留 nacos，其他全部删掉！
  cloud:
    sentinel:
      transport:
        dashboard: 192.168.100.128:8858
        port: 8721
      eager: true
      datasource:
        flow-rules:
          nacos:
            server-addr: 192.168.100.128:8848
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: 192.168.100.128:8848
            data-id: ${spring.application.name}-degrade-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade
    nacos:
      discovery:
        server-addr: 192.168.100.128:8848
        register-enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/second-hand-book-trading-platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: your-mysql-password

  data:
    redis:
      host: 192.168.100.128
      port: 6379
      password: your-redis-password
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.example.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: your-jwt-secret-key-at-least-256-bits
  expiration: 86400000

feign:
  sentinel:
    enabled: true

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    bucketName: second-hands
    accessKeyId: your-aliyun-oss-access-key-id
    accessKeySecret: your-aliyun-oss-access-key-secret